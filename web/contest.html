<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c4f9c'/%3E%3Crect x='6' y='7' width='20' height='4' rx='2' fill='%23ffffff'/%3E%3Crect x='6' y='15' width='14' height='3' rx='1.5' fill='%23a9c8ee'/%3E%3Crect x='6' y='22' width='17' height='3' rx='1.5' fill='%23a9c8ee'/%3E%3C/svg%3E">
<title>模拟赛 · 蓝桥杯 Python 模拟训练平台</title>
<link rel="stylesheet" href="assets/oj.css">
</head>
<body data-page="contest">
<header id="topbar"></header>

<main class="wrap">
  <h2 class="page-title">模拟赛</h2>
  <div id="noticeHost"></div>
  <div id="app"><div class="card loading"><span class="spin"></span>正在读取比赛数据…</div></div>
</main>

<footer id="foot"></footer>

<script src="assets/oj.js"></script>
<script>
(function () {
  'use strict';
  var el = OJ.el;
  OJ.initChrome('contest');

  var KEY = 'oj.contest.id';
  var S = { contests: [], bank: {}, board: null, offset: 0, timer: null, activeId: null,
            showReport: false, warned: false, poll: null };
  var hosts = {};

  /* ---------------- 工具 ---------------- */

  function byId(id) {
    var rows = (S.board && S.board.rows) || [];
    for (var i = 0; i < rows.length; i++) { if (rows[i].problem_id === id) { return rows[i]; } }
    return null;
  }

  function contestIds() {
    return (S.board && S.board.contest && S.board.contest.problem_ids) || [];
  }

  function fullTotal() {
    var sum = contestIds().reduce(function (a, id) { return a + ((S.bank[id] || {}).score || 0); }, 0);
    return sum || (S.board && S.board.full) || 0;
  }

  function nowServer() { return Date.now() / 1000 + S.offset; }

  function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }

  /* ---------------- 倒计时（本地每秒走，以服务端开赛时间为准） ---------------- */

  function tick() {
    var c = S.board && S.board.contest;
    if (!c || !hosts.clock) { return; }
    if (c.finished_at) {
      hosts.clock.textContent = '已结束';
      hosts.clock.className = 'clock over';
      stopTimer();
    } else {
      var left = (c.started_at + c.duration_s) - nowServer();
      hosts.clock.className = 'clock' + (left <= 0 ? ' over' : (left <= 600 ? ' urgent' : ''));
      hosts.clock.textContent = left <= 0 ? '时间到' : OJ.fmtClock(left);
      if (left <= 0) {
        stopTimer();
        if (!S.warned) {
          S.warned = true;
          var n = document.getElementById('timeUp');
          if (n) { n.classList.remove('hidden'); }
        }
      }
    }
    if (hosts.meta) {
      hosts.meta.textContent = '开始时间 ' + OJ.fmtTime(c.started_at) +
        '　已用 ' + OJ.fmtDur(Math.max(0, nowServer() - c.started_at)) +
        '　时长 ' + OJ.fmtDur(c.duration_s);
    }
    if (hosts.solved) { hosts.solved.textContent = ((S.board.solved || 0)) + '/' + contestIds().length; }
    if (hosts.score) { hosts.score.textContent = OJ.fmtScore(S.board.total) + ' / ' + OJ.fmtScore(fullTotal()); }
  }

  function startTimer() { stopTimer(); tick(); S.timer = setInterval(tick, 1000); }

  /* ---------------- 成绩单表格 ---------------- */

  function reportTable() {
    var body = el('tbody');
    var ids = contestIds();
    var list = ids.length ? ids.map(function (pid, i) {
      var r = byId(pid) || {};
      var p = S.bank[pid] || {};
      return {
        problem_id: pid,
        title: r.title || p.title || pid,
        score: r.score || 0,
        full: r.full || p.score || 0,
        tries: r.tries || 0,
        solved: !!r.solved,
        cost_s: r.cost_s
      };
    }) : (S.board.rows || []);
    list.forEach(function (r) {
      body.appendChild(el('tr', { class: 'clickable', onclick: function () {
        location.href = OJ.linkProblem(r.problem_id, S.board.contest.id);
      } }, [
        el('td', {}, [el('a', { href: OJ.linkProblem(r.problem_id, S.board.contest.id), text: r.title })]),
        el('td', { class: 'nowrap' }, [el('span', { class: 'st ' + (r.solved ? 'solved' : (r.tries ? 'tried' : 'todo')),
          text: r.solved ? '已解' : (r.tries ? '未通过（试过 ' + r.tries + ' 次）' : '没做') })]),
        el('td', { class: 'num nowrap', text: OJ.fmtScore(r.score) + ' / ' + OJ.fmtScore(r.full) }),
        el('td', { class: 'num nowrap', text: r.tries }),
        el('td', { class: 'num nowrap', text: (r.cost_s === null || r.cost_s === undefined) ? '—' : OJ.fmtDur(r.cost_s) })
      ]));
    });
    var b = S.board || {};
    var tries = list.reduce(function (a, r) { return a + (r.tries || 0); }, 0);
    body.appendChild(el('tr', {}, [
      el('td', { class: 'total-line', text: '合计' }),
      el('td', { text: '已解 ' + (b.solved || 0) + ' 题' }),
      el('td', { class: 'num total-line', text: OJ.fmtScore(b.total) + ' / ' + OJ.fmtScore(fullTotal()) }),
      el('td', { class: 'num', text: tries }),
      el('td', { class: 'num', text: OJ.fmtDur(b.elapsed) })
    ]));
    return el('div', { class: 'table-scroll' }, [el('table', { class: 'grid' }, [
      el('thead', {}, [el('tr', {}, [
        el('th', { text: '题目' }), el('th', { text: '状态' }), el('th', { class: 'num', text: '得分' }),
        el('th', { class: 'num', text: '尝试次数' }), el('th', { class: 'num', text: '耗时' })
      ])]),
      body
    ])]);
  }

  function reportCard() {
    var c = S.board.contest, b = S.board;
    return el('section', { class: 'card' }, [
      el('h3', { class: 'card-title' }, [document.createTextNode('成绩单　' + (c.title || ('模拟赛 #' + c.id))),
        el('span', { class: 'sub', text: c.finished_at ? ('交卷时间 ' + OJ.fmtTime(c.finished_at)) : '还没交卷，分数只是当前值' })]),
      el('div', { class: 'stat-grid' }, [
        { k: '总分', v: OJ.fmtScore(b.total) + ' / ' + OJ.fmtScore(fullTotal()), cls: '' },
        { k: '已解', v: (b.solved || 0) + ' / ' + contestIds().length + ' 题', cls: 's2' },
        { k: '实际用时', v: OJ.fmtDur(b.elapsed), cls: 's3' },
        { k: '提交总次数', v: String((b.rows || []).reduce(function (a, r) { return a + r.tries; }, 0)) + ' 次', cls: 's4' }
      ].map(function (x) {
        return el('div', { class: 'stat ' + x.cls }, [
          el('div', { class: 'k', text: x.k }), el('div', { class: 'v', text: x.v })
        ]);
      })),
      el('div', { class: 'sec' }, [el('h4', { text: '每题明细' }), reportTable()])
    ]);
  }

  function showReport() {
    if (!S.board) { return; }
    S.showReport = true;
    var host = document.getElementById('reportHost');
    if (host) {
      OJ.clear(host).appendChild(reportCard());
      host.scrollIntoView({ block: 'nearest' });
    }
  }

  /* ---------------- 进行中的比赛 ---------------- */

  function tabsNode() {
    var tabs = el('div', { class: 'tabs', id: 'cTabs' });
    contestIds().forEach(function (pid, i) {
      var p = S.bank[pid] || {};
      var r = byId(pid);
      tabs.appendChild(el('a', {
        class: 'tab' + (r && r.solved ? ' done' : (r ? ' tried' : '')),
        href: OJ.linkProblem(pid, S.board.contest.id),
        text: (i + 1) + '. ' + (p.title || pid) + (r ? '（' + OJ.fmtScore(r.score) + ' 分，' + r.tries + ' 次）' : '')
      }));
    });
    if (!contestIds().length) { tabs.appendChild(el('span', { class: 'muted small', text: '这场比赛没有题目。' })); }
    return tabs;
  }

  function runningCard() {
    var c = S.board.contest;
    hosts.clock = el('div', { class: 'clock', text: '--:--:--' });
    hosts.solved = el('b', { text: (S.board.solved || 0) + '/' + contestIds().length });
    hosts.score = el('b', { text: OJ.fmtScore(S.board.total) + ' / ' + OJ.fmtScore(fullTotal()) });
    hosts.meta = el('div', { class: 'contest-meta' });
    hosts.finish = el('button', { class: 'btn', type: 'button',
      text: c.finished_at ? '查看成绩单' : '交卷', onclick: function () {
        if (c.finished_at) { showReport(); } else { finish(); }
      } });
    hosts.rows = el('div', { id: 'runningRows' });

    var card = el('section', { class: 'card' }, [
      el('h3', { class: 'card-title' }, [document.createTextNode('考场：' + (c.title || '模拟赛')),
        el('span', { class: 'sub', text: '比赛编号 #' + c.id })]),
      el('div', { class: 'notice hidden', id: 'timeUp', text: '时间到了。还没写完的题先交卷，成绩按已通过的测试点计。' }),
      el('div', { class: 'verdict-head' }, [hosts.clock, el('div', { class: 'v-facts' }, [
        el('span', {}, [document.createTextNode('已解 '), hosts.solved]),
        el('span', {}, [document.createTextNode('当前得分 '), hosts.score])
      ])]),
      hosts.meta,
      el('div', { class: 'btn-row', style: 'margin:12px 0 4px' }, [
        hosts.finish,
        el('button', { class: 'btn ghost', type: 'button', text: '刷新成绩', onclick: function () { load(c.id, true); } }),
        el('a', { class: 'btn ghost', href: 'problems', text: '去题库' }),
        el('span', { class: 'muted small', text: '计时按服务端记录的开赛时间算，本页每秒更新，别信墙上的钟。' })
      ]),
      el('div', { class: 'sec' }, [el('h4', { text: '题目条（点标题进题目页，提交自动计入本场成绩）' }), tabsNode()]),
      el('div', { class: 'sec' }, [el('h4', { text: '当前得分明细' }), hosts.rows])
    ]);
    return card;
  }

  function drawRunningRows() {
    if (!hosts.rows || !S.board) { return; }
    OJ.clear(hosts.rows);
    if (!(S.board.rows || []).length) {
      hosts.rows.appendChild(el('div', { class: 'empty', text: '还没有提交，挑一道开始。交卷后这里就是成绩单。' }));
    } else {
      hosts.rows.appendChild(reportTable());
    }
  }

  /* ---------------- 交卷 ---------------- */

  function finish() {
    if (!S.board) { return; }
    if (!confirm('确定交卷吗？交卷后计时停止，这场比赛的得分就固定了。')) { return; }
    hosts.finish.disabled = true;
    hosts.finish.textContent = '正在交卷…';
    OJ.api.post('contest/finish', { id: S.board.contest.id }).then(function (board) {
      hosts.finish.disabled = false;
      if (!board || !board.contest) { alert('交卷失败：没找到这场比赛'); hosts.finish.textContent = '交卷'; return; }
      S.board = board;
      stopTimer();
      tick();
      drawRunningRows();
      return bootLists().then(function () {
        load(S.activeId, false, function () { showReport(); });
      });
    }, function (err) {
      hosts.finish.disabled = false;
      hosts.finish.textContent = '交卷';
      var n = OJ.clear(document.getElementById('noticeHost'));
      n.appendChild(OJ.failBox(err));
    });
  }

  /* ---------------- 开设比赛 ---------------- */

  function setupCard() {
    var ids = Object.keys(S.bank).sort();
    var today = new Date();
    var title = el('input', { type: 'text', value: '模拟赛 ' + (today.getMonth() + 1) + ' 月 ' +
      today.getDate() + ' 日', style: 'min-width:220px' });
    var dur = el('select');
    [{ v: '60', t: '60 分钟（小练习）' }, { v: '120', t: '120 分钟（半场）' },
     { v: '240', t: '240 分钟（正式赛，默认）' }].forEach(function (o) {
      dur.appendChild(el('option', { value: o.v, text: o.t }));
    });
    dur.value = '240';

    var boxes = [];
    var picks = el('div', { class: 'pick-list' });
    ids.forEach(function (pid, i) {
      var p = S.bank[pid];
      var cb = el('input', { type: 'checkbox', value: pid });
      cb.checked = true;
      cb.addEventListener('change', refreshSum);
      boxes.push(cb);
      picks.appendChild(el('label', {}, [cb,
        el('span', { text: (i + 1) + '. ' + p.title + '（' + OJ.fmtScore(p.score) + ' 分）' })]));
    });

    var sumLine = el('p', { class: 'muted small' });
    function checkedIds() { return boxes.filter(function (b) { return b.checked; }).map(function (b) { return b.value; }); }
    function refreshSum() {
      var sel = checkedIds();
      var total = sel.reduce(function (a, id) { return a + ((S.bank[id] || {}).score || 0); }, 0);
      sumLine.textContent = '已选 ' + sel.length + ' 道题，满分 ' + OJ.fmtScore(total) + ' 分（默认全选）。';
    }
    refreshSum();

    var go = el('button', { class: 'btn big', type: 'button', text: '开始比赛', onclick: function () {
      var sel = checkedIds();
      if (!sel.length) { alert('至少选一道题。'); return; }
      if (S.board && !S.board.contest.finished_at &&
          !confirm('已经有一场进行中的比赛，再开一场会让上一场留在进行中状态。继续吗？')) { return; }
      go.disabled = true;
      go.textContent = '正在开考…';
      OJ.api.post('contest/start', {
        title: title.value.trim() || '模拟赛', duration_min: Number(dur.value), problem_ids: sel
      }).then(function (res) {
        go.disabled = false;
        go.textContent = '开始比赛';
        OJ.store(KEY, String(res.id));
        S.activeId = res.id;
        S.board = null;
        S.showReport = false;
        S.warned = false;
        S.offset = (res.started_at || Date.now() / 1000) - Date.now() / 1000;
        load(res.id, true);
      }, function (err) {
        go.disabled = false;
        go.textContent = '开始比赛';
        OJ.clear(document.getElementById('noticeHost')).appendChild(OJ.failBox(err));
      });
    } });

    return el('section', { class: 'card' }, [
      el('h3', { class: 'card-title' }, [document.createTextNode('开一场模拟赛'),
        el('span', { class: 'sub', text: '考前至少完整走完一场 240 分钟' })]),
      el('div', { class: 'filters' }, [
        el('label', { class: 'field' }, [document.createTextNode('比赛名称'), title]),
        el('label', { class: 'field' }, [document.createTextNode('时长'), dur])
      ]),
      el('div', { class: 'btn-row', style: 'margin:12px 0 8px' }, [
        el('button', { class: 'btn small ghost', type: 'button', text: '全选',
          onclick: function () { boxes.forEach(function (b) { b.checked = true; }); refreshSum(); } }),
        el('button', { class: 'btn small ghost', type: 'button', text: '都不选',
          onclick: function () { boxes.forEach(function (b) { b.checked = false; }); refreshSum(); } }),
        el('span', { class: 'muted small', text: '选题范围：默认整个题库，共 ' + ids.length + ' 道题' })
      ]),
      picks,
      sumLine,
      el('div', { class: 'btn-row', style: 'margin-top:10px' }, [go]),
      el('p', { class: 'muted small', text: '比赛期间照常写代码、提交、看测试点，只是时间一直在走；同一道题可以反复交，取最高分。' })
    ]);
  }

  /* ---------------- 历史比赛 ---------------- */

  function historyCard() {
    var card = el('section', { class: 'card' }, [
      el('h3', { class: 'card-title' }, [document.createTextNode('历史比赛'),
        el('span', { class: 'sub', text: '最近 20 场' })])
    ]);
    if (!S.contests.length) {
      card.appendChild(el('div', { class: 'empty', text: '还没开过模拟赛。上面选好题、定时长，点开始比赛。' }));
      return card;
    }
    var body = el('tbody');
    S.contests.forEach(function (c) {
      var running = !c.finished_at;
      body.appendChild(el('tr', {}, [
        el('td', { class: 'mono nowrap', text: '#' + c.id }),
        el('td', {}, [el('a', { href: '#', text: c.title || '模拟赛', onclick: function (e) {
          e.preventDefault(); OJ.store(KEY, String(c.id)); S.showReport = true; load(c.id, true);
        } })]),
        el('td', { class: 'num nowrap', text: OJ.fmtDur(c.duration_s) }),
        el('td', { class: 'num nowrap', text: (c.problem_ids || []).length }),
        el('td', { class: 'nowrap', text: OJ.fmtTime(c.started_at) }),
        el('td', { class: 'nowrap' }, [el('span', { class: 'st ' + (running ? 'tried' : 'solved'),
          text: running ? '进行中' : '已结束' })]),
        el('td', { class: 'nowrap' }, [el('button', { class: 'btn small ghost', type: 'button',
          text: running ? '回到考场' : '看成绩单', onclick: function () {
            OJ.store(KEY, String(c.id)); S.showReport = running ? false : true; load(c.id, true);
          } })])
      ]));
    });
    card.appendChild(el('div', { class: 'table-scroll' }, [el('table', { class: 'grid' }, [
      el('thead', {}, [el('tr', {}, [
        el('th', { text: '编号' }), el('th', { text: '名称' }), el('th', { class: 'num', text: '时长' }),
        el('th', { class: 'num', text: '题量' }), el('th', { text: '开始时间' }),
        el('th', { text: '状态' }), el('th', { text: '操作' })
      ])]),
      body
    ])]));
    return card;
  }

  /* ---------------- 组装 ---------------- */

  function paint() {
    var app = OJ.clear(document.getElementById('app'));
    var rh = el('div', { id: 'reportHost' });
    app.appendChild(rh);
    if (S.board && S.board.contest) {
      if (S.showReport && S.board.contest.finished_at) { rh.appendChild(reportCard()); }
      app.appendChild(runningCard());
      drawRunningRows();
    }
    app.appendChild(setupCard());
    app.appendChild(historyCard());
    if (hosts.clock) { tick(); }
  }

  function load(cid, keepReport, done) {
    OJ.api.get('contest', { id: cid }).then(function (res) {
      var board = res && res.board;
      if (!board || !board.contest) {
        OJ.store(KEY, null);
        S.activeId = null;
        S.board = null;
        stopTimer();
        OJ.clear(document.getElementById('noticeHost')).appendChild(
          OJ.notice('之前记录的那场比赛已经找不到了（可能刚清空过数据）。重新开一场就行。', 'warn'));
        paint();
        return;
      }
      S.offset = (res.now || Date.now() / 1000) - Date.now() / 1000;
      S.board = board;
      S.activeId = board.contest.id;
      S.warned = false;
      if (!keepReport) { S.showReport = !!board.contest.finished_at; }
      if (board.contest.finished_at) { stopTimer(); }
      OJ.store(KEY, String(board.contest.id));
      paint();
      if (board.contest.finished_at) { tick(); if (done) { done(); } }
      else { startTimer(); if (done) { done(); } }
    }, function (err) {
      var app = OJ.clear(document.getElementById('app'));
      app.appendChild(OJ.failBox(err));
      app.appendChild(el('p', {}, [el('button', { class: 'btn ghost', type: 'button', text: '重新读取', onclick: boot })]));
    });
  }

  function bootLists() {
    return OJ.api.get('contest').then(function (res) {
      S.contests = (res && res.items) || [];
      var map = {};
      ((res && res.problems) || []).forEach(function (p) { map[p.id] = p; });
      S.bank = map;
    });
  }

  function silentRefresh() {
    if (!S.activeId || !S.board || S.board.contest.finished_at) { return; }
    OJ.api.get('contest', { id: S.activeId }).then(function (res) {
      if (!res || !res.board) { return; }
      S.offset = (res.now || Date.now() / 1000) - Date.now() / 1000;
      S.board = res.board;
      var t = document.getElementById('cTabs');
      if (t && t.parentNode) { t.parentNode.replaceChild(tabsNode(), t); }
      drawRunningRows();
      tick();
    }, function () { /* 网络抖一下不用管 */ });
  }

  function boot() {
    OJ.clear(document.getElementById('app')).appendChild(OJ.loading('正在读取比赛数据…'));
    Promise.all([bootLists(), OJ.api.get('problems').catch(function () { return {}; })]).then(function (res) {
      var st = (res[1] && res[1].stats) || {};
      OJ.setNavStat(st.solved, st.problems);
      var saved = OJ.store(KEY);
      if (saved) { S.activeId = Number(saved); load(S.activeId, false); }
      else { paint(); }
      if (S.poll) { clearInterval(S.poll); }
      S.poll = setInterval(silentRefresh, 20000);
    }, function (err) {
      var app = OJ.clear(document.getElementById('app'));
      app.appendChild(OJ.failBox(err));
      app.appendChild(el('p', {}, [el('button', { class: 'btn ghost', type: 'button', text: '重新读取', onclick: boot })]));
    });
  }

  boot();
})();
</script>
</body>
</html>
